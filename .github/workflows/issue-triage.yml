name: Issue triage

# Issue が登録された瞬間に、ラベル付け・自動チェック・受付コメントを行う
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-${{ github.event.issue.number }}

jobs:
  triage:
    # ボットが作った Issue には反応しない
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Issue の本文は外部からの入力なので、${{ }} でシェルに展開せず、スクリプト内でデータとして読む
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/issue-triage.js');
            await run({ github, context, core });
